name: Sandbox clarification preview
on:
  issues:
    types: [opened]
permissions: {}
concurrency:
  group: sandbox-clarifier-triage
  cancel-in-progress: false
  queue: max
  # One running/100 pending. Overflow has Actions cancellation records only.
jobs:
  gate:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.repository == 'peckyboi2/eslint' && github.repository_id == '1435519573' &&
      github.repository_owner == 'peckyboi2' && github.repository_owner_id == '234542779' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: verify
        env:
          CLARIFIER_READ_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/clarifier/workflow.py gate
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: intake-gate-${{ github.run_id }}
          path: evals/automatic-workflow
          retention-days: 30
          if-no-files-found: warn
  admission:
    needs: gate
    if: needs.gate.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/clarifier/workflow.py admit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: admission-${{ github.run_id }}
          path: evals/automatic-workflow
          retention-days: 30
          if-no-files-found: error
  inference:
    needs: [gate, admission]
    if: needs.gate.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: admission-${{ github.run_id }}
          path: evals/automatic-workflow
      - name: Install verified Linux Codex
        run: python3 -B scripts/clarifier/inference/hosted_install.py --destination "$RUNNER_TEMP/clarifier-bin" --github-path
      # The credential belongs only to the trusted gateway invocation.
      - env:
          CLARIFIER_READ_TOKEN: ${{ github.token }}
          CLARIFIER_PROVIDER_KEY: ${{ secrets.CLARIFIER_PROVIDER_KEY }}
        run: python3 -B scripts/clarifier/workflow.py infer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: preview-${{ github.run_id }}
          path: evals/automatic-workflow
          retention-days: 30
          if-no-files-found: error
