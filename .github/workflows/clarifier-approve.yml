name: Approve exact sandbox clarification
on:
  workflow_dispatch:
    inputs:
      preview_run:
        description: Exact successful issue-preview run ID
        required: true
        type: string
      exact_approval:
        description: Reviewed exact binding JSON including final comment hash
        required: true
        type: string
permissions: {}
jobs:
  approval:
    if: >-
      github.repository == 'peckyboi2/eslint' && github.repository_id == '1435519573' &&
      github.actor == 'peckyboi2' && github.actor_id == '234542779' &&
      github.triggering_actor == 'peckyboi2' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Deliberately blocked by require_live_release before tokens/artifact/public effects.
      # A future reviewed activation must add protected artifact transfer and comment-only permissions.
      - env:
          TRUSTED_GITHUB_CONTEXT: ${{ toJSON(github) }}
          EXACT_APPROVAL: ${{ inputs.exact_approval }}
        run: python3 -B scripts/clarifier/approve.py
